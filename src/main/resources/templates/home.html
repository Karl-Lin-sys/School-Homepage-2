<!DOCTYPE html>
<html th:replace="~{layout/base :: html(content=~{::main}, title='首頁')}">
<main>
    <div style="text-align: center; margin-bottom: 3rem;">
        <h1 style="font-size: 2.5rem; color: var(--primary); margin-bottom: 1rem;">歡迎來到中華科技大學</h1>
        <p style="font-size: 1.1rem; color: var(--text-muted); max-width: 600px; margin: 0 auto;">
            培養具備專業技能與創新精神的未來人才。
        </p>
    </div>

    <section style="margin-bottom: 3rem;">
        <h2 style="margin-bottom: 1.5rem; border-bottom: 2px solid var(--border); padding-bottom: 0.5rem;">快速連結</h2>
        <div class="grid">
            <a href="#" class="card" style="text-decoration:none; color:inherit;">
                <h3>學術單位</h3>
                <p style="color:var(--text-muted); margin-top:0.5rem;">各學院及系所資訊</p>
            </a>
            <a href="#" class="card" style="text-decoration:none; color:inherit;">
                <h3>行政單位</h3>
                <p style="color:var(--text-muted); margin-top:0.5rem;">各處室公告與服務</p>
            </a>
            <a href="#" class="card" style="text-decoration:none; color:inherit;">
                <h3>招生資訊</h3>
                <p style="color:var(--text-muted); margin-top:0.5rem;">入學管道與簡章下載</p>
            </a>
            <a th:href="@{/email/inbox}" class="card" style="text-decoration:none; color:inherit;">
                <h3>校園電子郵件</h3>
                <p style="color:var(--text-muted); margin-top:0.5rem;">教職員與學生信箱</p>
            </a>
        </div>
    </section>

    <section>
        <div style="display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 1.5rem; border-bottom: 2px solid var(--border); padding-bottom: 0.5rem;">
            <h2>最新消息</h2>
            <a th:href="@{/news}" style="color: var(--primary); text-decoration: none; font-weight: 500;">更多公告 &rarr;</a>
        </div>
        <div class="grid" th:if="${not #lists.isEmpty(latestNews)}">
            <div th:each="news : ${latestNews}" class="card">
                <div style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.5rem;" th:text="${#temporals.format(news.publishDate, 'yyyy-MM-dd')}">2026-08-14</div>
                <h3 style="margin-bottom: 0.5rem;"><a th:href="@{/news/{id}(id=${news.id})}" style="color:inherit; text-decoration:none;" th:text="${news.title}">News Title</a></h3>
                <span style="display:inline-block; padding: 0.2rem 0.5rem; background: var(--border); border-radius: 4px; font-size: 0.8rem;" th:text="${news.category}">Category</span>
            </div>
        </div>
        <p th:if="${#lists.isEmpty(latestNews)}" style="color: var(--text-muted);">目前沒有最新消息。</p>
    </section>
</main>
</html>

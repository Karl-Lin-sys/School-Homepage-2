<!DOCTYPE html>
<html th:replace="~{layout/base :: html(content=~{::main}, title='校園信箱收件匣')}">
<main>
    <div style="display: flex; gap: 2rem;">
        <aside style="width: 250px;">
            <div class="card" style="padding: 1rem;">
                <a th:href="@{/email/compose}" class="btn btn-primary" style="width: 100%; margin-bottom: 1.5rem;">撰寫新郵件</a>
                <ul style="list-style: none; display: flex; flex-direction: column; gap: 0.5rem;">
                    <li><a th:href="@{/email/inbox}" style="display: block; padding: 0.75rem 1rem; background: var(--bg-color); border-radius: var(--radius); text-decoration: none; color: var(--primary); font-weight: 500;">收件匣 (Inbox)</a></li>
                    <li><a href="#" style="display: block; padding: 0.75rem 1rem; text-decoration: none; color: var(--text-main);">寄件備份 (Sent)</a></li>
                    <li><a href="#" style="display: block; padding: 0.75rem 1rem; text-decoration: none; color: var(--text-main);">草稿 (Drafts)</a></li>
                </ul>
            </div>
        </aside>

        <section style="flex: 1;">
            <div class="card">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; padding-bottom: 1rem; border-bottom: 1px solid var(--border);">
                    <h2 style="font-size: 1.5rem;">收件匣</h2>
                </div>

                <div th:if="${param.sent}" style="padding: 1rem; background: hsl(120, 80%, 95%); color: hsl(120, 70%, 30%); border-radius: var(--radius); margin-bottom: 1rem;">
                    信件已成功寄出。
                </div>

                <!-- Mock Inbox Items -->
                <div style="display: flex; flex-direction: column;">
                    <div style="display: flex; padding: 1rem; border-bottom: 1px solid var(--border); align-items: center; background: var(--bg-color);">
                        <div style="flex: 0 0 150px; font-weight: 600;">教務處</div>
                        <div style="flex: 1; font-weight: 600;">115學年度第一學期選課注意事項</div>
                        <div style="flex: 0 0 100px; text-align: right; color: var(--text-muted); font-size: 0.9rem;">10:30 AM</div>
                    </div>
                    <div style="display: flex; padding: 1rem; border-bottom: 1px solid var(--border); align-items: center;">
                        <div style="flex: 0 0 150px;">圖書館</div>
                        <div style="flex: 1; color: var(--text-muted);">圖書逾期通知 - 請盡速歸還</div>
                        <div style="flex: 0 0 100px; text-align: right; color: var(--text-muted); font-size: 0.9rem;">昨天</div>
                    </div>
                </div>
            </div>
        </section>
    </div>
</main>
</html>

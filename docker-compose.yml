version: '3.8'

services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/custdb
      - SPRING_DATASOURCE_USERNAME=custadmin
      - SPRING_DATASOURCE_PASSWORD=securepassword
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    depends_on:
      - db
    networks:
      - cust-network

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=custdb
      - POSTGRES_USER=custadmin
      - POSTGRES_PASSWORD=securepassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - cust-network

volumes:
  pgdata:

networks:
  cust-network:
    driver: bridge
